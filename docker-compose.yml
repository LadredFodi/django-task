version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.5
    container_name: dealership_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME:-dealership_db}
      - POSTGRES_USER=${DB_USER:-dealership_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-dealership_pass}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dealership_user} -d ${DB_NAME:-dealership_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dealership_network

  redis:
    image: redis:7-alpine
    container_name: dealership_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dealership_network

  web:
    build: .
    container_name: dealership_web
    command: >
      sh -c "mkdir -p /app/logs &&
             python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application -c gunicorn.conf.py"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - dealership_network

  nginx:
    image: nginx:1.25-alpine
    container_name: dealership_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - dealership_network

  celery_worker:
    build: .
    container_name: dealership_celery_worker
    command: celery -A config worker -l info --concurrency=2
    restart: unless-stopped
    volumes:
      - .:/app
      - logs_volume:/app/logs
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings}
    depends_on:
      - db
      - redis
      - web
    networks:
      - dealership_network

  celery_beat:
    build: .
    container_name: dealership_celery_beat
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: unless-stopped
    volumes:
      - .:/app
      - logs_volume:/app/logs
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings}
    depends_on:
      - db
      - redis
      - web
    networks:
      - dealership_network

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  logs_volume:
  nginx_logs:

networks:
  dealership_network:
    driver: bridge

