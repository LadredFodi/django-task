[pytest]
DJANGO_SETTINGS_MODULE = config.tests.settings_test
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*

markers =
    unit
    api
    celery
    integration
    slow
    permissions

addopts =
    --verbose
    --strict-markers
    --tb=short
    --maxfail=5
    -p no:warnings

testpaths = 
    cars
    customers
    dealerships
    offers
    suppliers
    promotions
    config

norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    venv
    env
    staticfiles
    media
    logs
    migrations
    __pycache__

django_find_project = true
console_output_style = progress
